server:
  port: 8080

spring:
  application:
    name: catalog
  datasource:
    url: jdbc:h2:mem:catalogdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    issuer: catalog-api
    ttl: 15m
    refresh-ttl: 7d
    active-kid: catalog-key-2
    public-key: classpath:keys/catalog-key-2.pub
    private-key: classpath:keys/catalog-key-2.key
    old-public-key: classpath:keys/catalog-key-1.pub
    old-private-key: classpath:keys/catalog-key-1.key
  seed-admin:
    enabled: true
    username: admin
    password: ${ADMIN_PASSWORD:DefaultAdminPass2026}

springdoc:
  api-docs:
    version: openapi_3_1
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
  paths-to-match: /api/**, /.well-known/**
